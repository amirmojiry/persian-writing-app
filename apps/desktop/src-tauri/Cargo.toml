[package]
name = "persian-writing-desktop"
version = "0.6.0"
description = "Desktop shell for the Persian Name Writing App"
authors = ["Persian Writing App contributors"]
edition = "2021"

[lib]
name = "persian_writing_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
